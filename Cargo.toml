[package]
name = "sl-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel-async = { version = "0.9", features = ["sqlite", "migrations"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
rustls = "0.23"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

