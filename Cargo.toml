[package]
name = "sl-runner"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel-async = { version = "0.9", features = ["sqlite", "migrations"] }
diesel_migrations = { version = "2.3", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = true

